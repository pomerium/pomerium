syntax = "proto3";

package idpsession;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/pomerium/pomerium/pkg/grpc/idpsession";

message IDToken {
  string                    issuer     = 1;
  string                    subject    = 2;
  google.protobuf.Timestamp expires_at = 3;
  google.protobuf.Timestamp issued_at  = 4;
  string                    raw        = 5;
}

message OAuthToken {
  string                    access_token  = 1;
  string                    token_type    = 2;
  google.protobuf.Timestamp expires_at    = 3;
  string                    refresh_token = 4;
}

// IDPSession represents a single sign-on against an upstream IDP, holding the
// one set of tokens that sign-on was issued. Its ID is the ID of the client
// session handle that created it, so a user with several sign-ons has several
// IDPSession records, each refreshed independently.
message IDPSession {
  string id = 1;
  string raw_id_token = 2;
  IDToken id_token = 3;
  OAuthToken oauth_token = 4;
  google.protobuf.Struct claims = 5;
  // sid is the "sid" claim of the ID token, identifying the upstream IDP
  // session this sign-on belongs to. IDPs may not identify sessions using sid.
  optional string sid = 6;
  // user_claims holds the user level claims from the user record, kept here so
  // they can be propagated to the records bound to this session.
  string idp_id = 7;
  string user_id = 8;

  google.protobuf.Timestamp initiated_at = 9;
  optional string initated_by = 10;
  optional string initiated_by_addr = 11;
}

enum BindingProtocol {
  BINDING_PROTOCOL_UNKNOWN = 0;
  BINDING_PROTOCOL_BROWSER = 1;
  BINDING_PROTOCOL_MCP = 2;
}

// Binding binds a particular client session to a user's centralized IDP session. It
// is used to map (in a concurrently safe way) which Pomerium client sessions
// belong to a user's IDP session.
// In particular, a Binding's ID must match its corresponding client session's ID. The
// type of client it is bound to is represented by its type_url field.
// It acts an authoritative source about the state of the session (active vs revoked).
// A Binding must point to their parent IDPSession.
// Direct deletion can leave a client session active, so consumers of the Binding
// record must mark it revoked instead.
// After being revoked, bindings are cleaned up after a grace period to allow for
// client sessions to be deterministically invalidated.
// The invalidation of its parent IDPSession invalidates all depedent client
// sessions.
// Binding IDs should be unique to a client session and never re-used on subsequent bindings
// of the same client session type.
message Binding {
    string id = 1;
    // type_url is the type_url of the record this binding points to.
    string type_url = 2;
    // idp_session_id the parent IDPSession id.
    string idp_session_id = 3;
    BindingProtocol protocol = 4;
    google.protobuf.Timestamp initiated_at = 5;
    // details holds some user friendly details about
    // the client of this binding.
    map<string,string> details = 6;
    // user_id is the user the parent IDPSession belongs to.
    string user_id = 7;
}
