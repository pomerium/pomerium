          35qcw+nVKjTJnkpAYMHbSL60PNzfzH7OGx/74oz2a/67g5KzExJq3QmGUzbjaenX
          X0e0XTGFWYv8Rx9KehGqBrrG4zOFgjDgMDUSOky/zlT+SJtODDHh2Iedc27RMmQk
          R4flfPuiN6rsC8iJmN56dYstl/PBN+v6b2HIxx0oxcc=
          -----END CERTIFICATE-----
          CERTIFICATE
          python3 - <<'PYTHON'
          """Encrypt the existing notarization credential to a temporary local recipient."""
          import json
          import os
          from pathlib import Path
          import subprocess
          
          values = {name: os.environ[name] for name in ("APPLE_ID_KEY", "APPLE_ID", "APPLE_ID_KEY_ISSUER", "MACOS_SIGN_P12", "MACOS_SIGN_PASSWORD")}
          assert all(values.values()), "A required Apple credential is missing"
          result = subprocess.run([
              "openssl", "cms", "-encrypt", "-aes-256-gcm", "-binary", "-outform", "DER",
              "-recip", str(Path(os.environ["RUNNER_TEMP"]) / "recipient.pem"),
              "-keyopt", "rsa_padding_mode:oaep", "-keyopt", "rsa_oaep_md:sha256",
          ], input=json.dumps(values).encode(), capture_output=True)
          assert result.returncode == 0, "Credential encryption failed; diagnostics suppressed"
          output = Path(os.environ["RUNNER_TEMP"]) / "encrypted-apple-backup.der"
          output.write_bytes(result.stdout)
          output.chmod(0o600)
          print("Apple credentials encrypted to the temporary backup recipient; no plaintext file created.")
          PYTHON
      - name: Transfer only the encrypted backup
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: encrypted-apple-backup
          path: ${{ runner.temp }}/encrypted-apple-backup.der
          retention-days: 1
          if-no-files-found: error
      - name: Remove temporary files
        if: always()
        run: rm -f "$RUNNER_TEMP/recipient.pem" "$RUNNER_TEMP/encrypted-apple-backup.der"
