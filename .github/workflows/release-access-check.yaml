name: Release access verification
on:
  push:
    tags:
      - v0.0.0-release-access-check.1
permissions:
  contents: read
  packages: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: apple-signing
    steps:
      - name: Pull both private images with the Core Actions token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYTHON'
          """Verify private GHCR image reads with this repository's Actions token."""
          import base64
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          
          
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  if urllib.parse.urlparse(newurl).scheme != "https":
                      raise RuntimeError("Registry returned an insecure redirect")
                  redirected = super().redirect_request(req, fp, code, msg, headers, newurl)
                  if urllib.parse.urlparse(req.full_url).netloc != urllib.parse.urlparse(newurl).netloc:
                      redirected.remove_header("Authorization")
                  return redirected
          
          
          opener = urllib.request.build_opener(SafeRedirect())
          accept = ", ".join([
              "application/vnd.oci.image.index.v1+json",
              "application/vnd.oci.image.manifest.v1+json",
              "application/vnd.docker.distribution.manifest.list.v2+json",
              "application/vnd.docker.distribution.manifest.v2+json",
          ])
          
          
          def request(url, authorization=None):
              headers = {"Accept": accept}
              if authorization:
                  headers["Authorization"] = authorization
              return opener.open(urllib.request.Request(url, headers=headers), timeout=90)
          
          
          for package in ["pomerium-enterprise", "ingress-controller-enterprise"]:
              path = "pomerium/" + package
              scope = urllib.parse.urlencode({"service": "ghcr.io", "scope": "repository:" + path + ":pull"})
              token_url = "https://ghcr.io/token?" + scope
              anonymous_denied = False
              try:
                  with request(token_url) as response:
                      anonymous_token = json.load(response)["token"]
                  with request("https://ghcr.io/v2/" + path + "/tags/list?n=100", "Bearer " + anonymous_token):
                      pass
              except urllib.error.HTTPError as error:
                  if error.code not in (401, 403):
                      raise RuntimeError("Anonymous registry check: HTTP " + str(error.code)) from None
                  anonymous_denied = True
              assert anonymous_denied, "Expected a private package for the Actions access check"
              basic = base64.b64encode((os.environ["GITHUB_ACTOR"] + ":" + os.environ["GH_TOKEN"]).encode()).decode()
              try:
                  with request(token_url, "Basic " + basic) as response:
                      token = json.load(response)["token"]
                  base = "https://ghcr.io/v2/" + path
                  with request(base + "/tags/list?n=100", "Bearer " + token) as response:
                      tags = json.load(response)["tags"]
                  assert tags, "Package has no tags"
                  tag = "latest" if "latest" in tags else sorted(tags)[-1]
          
                  def manifest(ref):
                      with request(base + "/manifests/" + ref, "Bearer " + token) as response:
                          data = response.read()
                      if ref.startswith("sha256:"):
                          assert hashlib.sha256(data).hexdigest() == ref[7:], "Manifest digest mismatch"
                      return json.loads(data)
          
                  image = manifest(tag)
                  if "manifests" in image:
                      candidates = [m for m in image["manifests"] if m.get("platform", {}).get("os") == "linux" and m.get("platform", {}).get("architecture") == "amd64"]
                      assert candidates, "Package has no linux/amd64 image"
                      image = manifest(candidates[0]["digest"])
                  blobs = [image["config"], *image["layers"]]
                  total = 0
                  for blob in blobs:
                      digest = blob["digest"]
                      assert digest.startswith("sha256:"), "Unsupported blob digest"
                      hashed = hashlib.sha256()
                      count = 0
                      with request(base + "/blobs/" + digest, "Bearer " + token) as response:
                          while chunk := response.read(1024 * 1024):
                              hashed.update(chunk)
                              count += len(chunk)
                      assert hashed.hexdigest() == digest[7:], "Blob digest mismatch"
                      assert count == blob["size"], "Blob size mismatch"
                      total += count
                  print(json.dumps({"package": path, "anonymous_denied": True, "actions_pull": "passed", "platform": "linux/amd64", "blobs_verified": len(blobs), "bytes_verified": total}), flush=True)
              except urllib.error.HTTPError as error:
                  raise RuntimeError(package + ": HTTP " + str(error.code)) from None
          PYTHON
      - name: Encrypt existing Apple credentials for their secret-storage backup
        env:
          APPLE_ID_KEY: ${{ secrets.APPLE_ID_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_KEY_ISSUER: ${{ secrets.APPLE_ID_KEY_ISSUER }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
