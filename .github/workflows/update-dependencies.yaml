name: Update Dependencies

on:
  schedule:
    - cron: "40 1 * * *"
  workflow_dispatch:

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Setup ASDF
        uses: asdf-vm/actions/install@b7bcd026f18772e44fe1026d729e1611cc435d47

      - name: Update Tools
        run: ./scripts/update-dependencies tools

      - name: Update Docker Dependencies
        run: ./scripts/update-dependencies docker

      - name: Update Pomerium Dependencies
        run: ./scripts/update-dependencies pomerium

      - name: Proto
        run: make proto

      - name: Check for Changes
        id: git-diff
        run: |
          git config --global user.email "346165314+pomerium-ci-bot[bot]@users.noreply.github.com"
          git config --global user.name "pomerium-ci-bot[bot]"
          git add .
          git diff --cached --exit-code || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Create CI token
        id: ci-token
        if: ${{ steps.git-diff.outputs.changed }} == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ secrets.POMERIUM_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.POMERIUM_CI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Create Pull Request
        if: ${{ steps.git-diff.outputs.changed }} == 'true'
        uses: peter-evans/create-pull-request@98357b18bf14b5342f975ff684046ec3b2a07725
        with:
          author: pomerium-ci-bot[bot] <346165314+pomerium-ci-bot[bot]@users.noreply.github.com>
          body: "This PR updates dependencies not managed by dependabot."
          branch: ci/update-core
          commit-message: "ci: update dependencies"
          delete-branch: true
          labels: ci
          title: "ci: update dependencies"
          token: ${{ steps.ci-token.outputs.token }}
