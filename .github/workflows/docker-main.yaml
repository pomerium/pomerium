name: Docker Main
permissions:
  contents: read
on:
  push:
    branches:
      - main
      - cdoxsey/docker-fix

jobs:
  publish:
    runs-on: ubuntu-22.04
    outputs:
      sha-tag: ${{ steps.metadata.outputs.sha-tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .tool-versions

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: .tool-versions

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build Binary
        run: |
          set -euo pipefail
          make build-ui

          mkdir -p dist/docker/amd64 dist/docker/arm64

          GOOS=linux GOARCH=amd64 make build-go
          cp bin/pomerium dist/docker/amd64/pomerium

          GOOS=linux GOARCH=arm64 make build-go
          cp bin/pomerium dist/docker/arm64/pomerium

      - name: gcloud authenticate
        id: gcloud-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ secrets.GCP_PRODUCTION_PROJECT_ID }}
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: gcloud sdk
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          skip_install: true

      - name: gcloud auth configure-docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Prepare Image Metadata
        id: metadata
        run: |
          IMAGE=us-central1-docker.pkg.dev/pomerium-public-prd/pomerium/pomerium
          SHA_TAG=git-${GITHUB_SHA::8}
          TAGS="${IMAGE}:main ${IMAGE}:master ${IMAGE}:${SHA_TAG}"
          TS=$(date +%Y%m%d%H%M%S)
          {
            echo "tags=${TAGS}"
            echo "timestamp=${TS}"
            echo "name=pomerium"
            echo "sha-tag=${SHA_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Docker Publish - Main AMD64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./dist/docker/amd64
          file: ./.github/Dockerfile-release
          push: true
          platforms: linux/amd64
          provenance: false
          tags: us-central1-docker.pkg.dev/pomerium-public-prd/pomerium/pomerium:${{ steps.metadata.outputs.sha-tag }}-amd64
          labels: |
            org.opencontainers.image.created=${{ steps.metadata.outputs.timestamp }}
            org.opencontainers.image.name=${{ steps.metadata.outputs.name }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Docker Publish - Main ARM64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./dist/docker/arm64
          file: ./.github/Dockerfile-release
          push: true
          platforms: linux/arm64
          provenance: false
          tags: us-central1-docker.pkg.dev/pomerium-public-prd/pomerium/pomerium:${{ steps.metadata.outputs.sha-tag }}-arm64v8
          labels: |
            org.opencontainers.image.created=${{ steps.metadata.outputs.timestamp }}
            org.opencontainers.image.name=${{ steps.metadata.outputs.name }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Docker Publish - Main Manifest
        run: |
          for tag in ${{ steps.metadata.outputs.tags }}
          do
            docker manifest create -a $tag \
              us-central1-docker.pkg.dev/pomerium-public-prd/pomerium/pomerium:${{ steps.metadata.outputs.sha-tag }}-amd64 \
              us-central1-docker.pkg.dev/pomerium-public-prd/pomerium/pomerium:${{ steps.metadata.outputs.sha-tag }}-arm64v8
            docker manifest push $tag
          done

      - name: Docker Publish - Debug Main AMD64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./dist/docker/amd64
          file: ./.github/Dockerfile-release-debug
          push: true
          platforms: linux/amd64
          provenance: false
          tags: us-central1-docker.pkg.dev/pomerium-public-prd/pomerium/pomerium:debug-amd64-main
          labels: |
            org.opencontainers.image.created=${{ steps.metadata.outputs.timestamp }}
            org.opencontainers.image.name=${{ steps.metadata.outputs.name }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Docker Publish - Debug Main ARM64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./dist/docker/arm64
          file: ./.github/Dockerfile-release-debug
          push: true
          platforms: linux/arm64
          provenance: false
          tags: us-central1-docker.pkg.dev/pomerium-public-prd/pomerium/pomerium:debug-arm64v8-main
          labels: |
            org.opencontainers.image.created=${{ steps.metadata.outputs.timestamp }}
            org.opencontainers.image.name=${{ steps.metadata.outputs.name }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Docker Publish - Debug Main Manifest
        run: |
          docker manifest create -a us-central1-docker.pkg.dev/pomerium-public-prd/pomerium/pomerium:debug-main \
            us-central1-docker.pkg.dev/pomerium-public-prd/pomerium/pomerium:debug-amd64-main \
            us-central1-docker.pkg.dev/pomerium-public-prd/pomerium/pomerium:debug-arm64v8-main
          docker manifest push us-central1-docker.pkg.dev/pomerium-public-prd/pomerium/pomerium:debug-main

  deploy:
    runs-on: ubuntu-22.04
    needs: publish
    steps:
      - name: Checkout Gitops Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pomerium/gitops-argocd
          token: ${{ secrets.APPARITOR_GITHUB_TOKEN }}

      - name: Bump psql environment
        uses: mikefarah/yq@c14f446382944492701b16c1ddb48bb9dbe683e3
        with:
          cmd:
            yq eval '.pomerium.image.tag = "${{ needs.publish.outputs.sha-tag }}"' -i
            projects/pomerium-master-postgres/pomerium/values.yaml

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d
        with:
          commit_message: |
            Bump test environment pomerium/pomerium
            Image tag: ${{ needs.publish.outputs.sha-tag }}
            Source Repo: ${{ github.repository }}@${{ github.sha }}
