name: Lint
permissions:
  contents: read
on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    # A rejected client certificate makes dagger retry instead of failing.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Runs on the shared Dagger engine (or a local one without credentials, e.g. for forks).
      - uses: calebdoxsey/pomerium-dagger-poc/actions/run@main
        with:
          args: --check lint
          engine-ca-cert: ${{ secrets.DAGGER_CA_CERT }}
          engine-client-cert: ${{ secrets.DAGGER_CLIENT_CERT }}
          engine-client-key: ${{ secrets.DAGGER_CLIENT_KEY }}
