name: Release
run-name: Release ${{ inputs.version }}
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (vX.Y.Z)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}

jobs:
  plan:
    runs-on: ubuntu-22.04
    steps:
      - name: Check release environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/environments/release" --jq 'any(.protection_rules[]; .type == "required_reviewers")')" = true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Create CI token
        id: ci-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ secrets.POMERIUM_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.POMERIUM_CI_APP_PRIVATE_KEY }}
          owner: pomerium
          repositories: ingress-controller,pomerium-console,pomerium-enterprise
          permission-contents: write

      - name: Plan
        env:
          GH_TOKEN: ${{ steps.ci-token.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: ./scripts/release plan "$VERSION" "$GITHUB_REF_NAME"

  core:
    needs: plan
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    environment: apple-signing
    outputs:
      state: ${{ steps.release.outputs.state }}
    env:
      DOCKER_CLI_EXPERIMENTAL: "enabled"
    steps:
      - name: Check signing secrets
        env:
          SECRETS_SET: ${{ secrets.MACOS_SIGN_P12 && secrets.MACOS_SIGN_PASSWORD && secrets.MACOS_NOTARY_KEY && secrets.MACOS_NOTARY_KEY_ID && secrets.MACOS_NOTARY_ISSUER_ID && 'true' }}
        run: test "$SECRETS_SET" = true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Unshallow
        run: git fetch --prune --unshallow

      - name: Tag
        env:
          VERSION: ${{ inputs.version }}
        run: git tag "$VERSION"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .tool-versions
          package-manager-cache: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: .tool-versions
          cache: false

      - name: Build dependencies without signing secrets
        run: make deps-build build-ui

      - name: Set up Docker
        run: docker run --rm --privileged multiarch/qemu-user-static:7.2.0-1@sha256:fe60359c92e86a43cc87b3d906006245f77bfc0565676b80004cc666e4feb9f0 --reset -p yes

      - name: gcloud authenticate
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: gcloud sdk
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db

      - name: Gcloud login
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          previous=()
          if [[ $VERSION =~ ^v([0-9]+)\.([1-9][0-9]*)\.0$ ]]; then
            previous=(-f "previous_tag_name=v${BASH_REMATCH[1]}.$((BASH_REMATCH[2] - 1)).0")
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$VERSION" -f target_commitish="$GITHUB_SHA" "${previous[@]}" --jq .body > "$RUNNER_TEMP/notes.md"

      - name: Delete drafts
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          drafts=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft and .tag_name == env.VERSION) | .id')
          for id in $drafts; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done

      - name: Get GoReleaser version
        id: goreleaser-version
        run: echo "version=v$(grep '^goreleaser ' .tool-versions | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          version: ${{ steps.goreleaser-version.outputs.version }}
          args: release --clean --skip=before --config .github/goreleaser.yaml --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ inputs.version }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

      - name: Record release state
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          state=$(./scripts/release release-state pomerium "$VERSION")
          echo "state=$state" >> "$GITHUB_OUTPUT"

  ingress-controller:
    needs: plan
    runs-on: ubuntu-22.04
    outputs:
      state: ${{ steps.release.outputs.state }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Create CI token
        id: ci-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ secrets.POMERIUM_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.POMERIUM_CI_APP_PRIVATE_KEY }}
          owner: pomerium
          repositories: ingress-controller
          permission-actions: write
          permission-contents: write

      - name: Build candidate
        env:
          GH_TOKEN: ${{ steps.ci-token.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: ./scripts/release dispatch ingress-controller release.yaml "$GITHUB_REF_NAME" "$VERSION" "$GITHUB_RUN_ID" core_sha="$GITHUB_SHA"

      - name: Record release state
        id: release
        env:
          GH_TOKEN: ${{ steps.ci-token.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          state=$(./scripts/release release-state ingress-controller "$VERSION")
          echo "state=$state" >> "$GITHUB_OUTPUT"

  console:
    needs: plan
    runs-on: ubuntu-22.04
    outputs:
      state: ${{ steps.release.outputs.state }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Create CI token
        id: ci-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ secrets.POMERIUM_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.POMERIUM_CI_APP_PRIVATE_KEY }}
          owner: pomerium
          repositories: pomerium-console
          permission-actions: write
          permission-contents: write

      - name: Build candidate
        env:
          GH_TOKEN: ${{ steps.ci-token.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: ./scripts/release dispatch pomerium-console publish.yml "$GITHUB_REF_NAME" "$VERSION" "$GITHUB_RUN_ID"

      - name: Record release state
        id: release
        env:
          GH_TOKEN: ${{ steps.ci-token.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          state=$(./scripts/release release-state pomerium-console "$VERSION")
          echo "state=$state" >> "$GITHUB_OUTPUT"

  enterprise:
    needs: [core, ingress-controller, console]
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-22.04
    outputs:
      enterprise: ${{ steps.candidates.outputs.enterprise }}
      enterprise-debug: ${{ steps.candidates.outputs.enterprise-debug }}
      enterprise-nonroot: ${{ steps.candidates.outputs.enterprise-nonroot }}
      enterprise-debug-nonroot: ${{ steps.candidates.outputs.enterprise-debug-nonroot }}
      enterprise-ingress-controller: ${{ steps.candidates.outputs.enterprise-ingress-controller }}
      ingress-controller: ${{ steps.candidates.outputs.ingress-controller }}
      console: ${{ steps.candidates.outputs.console }}
      cloudrun: ${{ steps.candidates.outputs.cloudrun }}
      extension: ${{ steps.candidates.outputs.extension }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Create CI token
        id: ci-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ secrets.POMERIUM_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.POMERIUM_CI_APP_PRIVATE_KEY }}
          owner: pomerium
          repositories: pomerium-enterprise
          permission-actions: write
          permission-contents: read

      - name: Build candidate
        env:
          GH_TOKEN: ${{ steps.ci-token.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: ./scripts/release dispatch pomerium-enterprise candidate.yaml "$GITHUB_REF_NAME" "$VERSION" "$GITHUB_RUN_ID"

      - name: gcloud authenticate
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: gcloud sdk
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db

      - name: Registry login
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev
          docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$GITHUB_TOKEN"

      - name: Read candidates
        id: candidates
        env:
          GH_TOKEN: ${{ steps.ci-token.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          while read -r name repository tag; do
            digest=$(./scripts/release digest "$repository:$tag")
            echo "$name=$repository@$digest" >> "$GITHUB_OUTPUT"
          done <<EOF
          enterprise ghcr.io/pomerium/pomerium-enterprise $VERSION
          enterprise-debug ghcr.io/pomerium/pomerium-enterprise debug-$VERSION
          enterprise-nonroot ghcr.io/pomerium/pomerium-enterprise nonroot-$VERSION
          enterprise-debug-nonroot ghcr.io/pomerium/pomerium-enterprise debug-nonroot-$VERSION
          enterprise-ingress-controller ghcr.io/pomerium/ingress-controller-enterprise $VERSION
          cloudrun us-central1-docker.pkg.dev/pomerium-public-prd/pomerium/pomerium $VERSION-cloudrun
          EOF
          pins=$(gh api "repos/pomerium/pomerium-enterprise/contents/dependencies.env?ref=$VERSION" -H "Accept: application/vnd.github.raw")
          extension=$(sed -nE 's/^EXTENSION_VERSION="([0-9a-f]{40})-.*/\1/p' <<<"$pins")
          ingress_controller=$(sed -nE 's/^INGRESS_CONTROLLER_VERSION=".*@(sha256:[0-9a-f]{64})"$/\1/p' <<<"$pins")
          console=$(sed -nE 's/^CONSOLE_VERSION=".*@(sha256:[0-9a-f]{64})"$/\1/p' <<<"$pins")
          [[ -n $extension && -n $ingress_controller && -n $console ]]
          {
            echo "extension=$extension"
            echo "ingress-controller=us-central1-docker.pkg.dev/pomerium-public-prd/ingress-controller/ingress-controller@$ingress_controller"
            echo "console=gcr.io/pomerium-registry/pomerium-console@$console"
          } >> "$GITHUB_OUTPUT"

  acceptance:
    needs: enterprise
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/acceptance.yaml
    with:
      image: ${{ needs.enterprise.outputs.enterprise }}

  promote:
    needs: [core, ingress-controller, console, enterprise, acceptance]
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-22.04
    environment: release
    env:
      VERSION: ${{ inputs.version }}
      CORE_STATE: ${{ needs.core.outputs.state }}
      INGRESS_CONTROLLER_STATE: ${{ needs.ingress-controller.outputs.state }}
      CONSOLE_STATE: ${{ needs.console.outputs.state }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Create CI token
        id: ci-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ secrets.POMERIUM_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.POMERIUM_CI_APP_PRIVATE_KEY }}
          owner: pomerium
          repositories: pomerium,ingress-controller,pomerium-console,envoy-custom,enterprise-extensions,homebrew-tap
          permission-contents: write
          permission-workflows: write

      - name: Check latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(./scripts/release is-latest "$VERSION")
          echo "LATEST=$latest" >> "$GITHUB_ENV"

      - name: gcloud authenticate
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: gcloud sdk
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db

      - name: Registry login
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          CLOUDSMITH_USER: ${{ secrets.CLOUDSMITH_USER }}
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gcloud auth configure-docker gcr.io,us-central1-docker.pkg.dev
          docker login --username "$DOCKERHUB_USER" --password-stdin <<<"$DOCKERHUB_TOKEN"
          docker login docker.cloudsmith.io --username "$CLOUDSMITH_USER" --password-stdin <<<"$CLOUDSMITH_API_KEY"
          docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$GITHUB_TOKEN"

      - name: Check releases
        env:
          GH_TOKEN: ${{ steps.ci-token.outputs.token }}
        run: |
          ./scripts/release check-release pomerium "$VERSION" "$CORE_STATE"
          ./scripts/release check-release ingress-controller "$VERSION" "$INGRESS_CONTROLLER_STATE"
          ./scripts/release check-release pomerium-console "$VERSION" "$CONSOLE_STATE"

      - name: Copy images
        env:
          ENTERPRISE: ${{ needs.enterprise.outputs.enterprise }}
          ENTERPRISE_DEBUG: ${{ needs.enterprise.outputs.enterprise-debug }}
          ENTERPRISE_NONROOT: ${{ needs.enterprise.outputs.enterprise-nonroot }}
          ENTERPRISE_DEBUG_NONROOT: ${{ needs.enterprise.outputs.enterprise-debug-nonroot }}
          ENTERPRISE_INGRESS_CONTROLLER: ${{ needs.enterprise.outputs.enterprise-ingress-controller }}
          INGRESS_CONTROLLER: ${{ needs.enterprise.outputs.ingress-controller }}
          CONSOLE: ${{ needs.enterprise.outputs.console }}
          CLOUDRUN: ${{ needs.enterprise.outputs.cloudrun }}
        run: |
          minor=${VERSION%.*}
          latest=${LATEST#false}
          while read -ra row; do
            for tag in "${row[@]:2}"; do
              echo "${row[0]} ${row[1]}:$tag"
            done
          done > "$RUNNER_TEMP/images" <<EOF
          $ENTERPRISE docker.io/pomerium/pomerium $VERSION $minor ${latest:+latest}
          $ENTERPRISE docker.cloudsmith.io/pomerium/pomerium-enterprise/pomerium-enterprise $VERSION $minor ${latest:+latest}
          $ENTERPRISE_DEBUG docker.io/pomerium/pomerium debug-$VERSION debug-$minor ${latest:+debug}
          $ENTERPRISE_DEBUG docker.cloudsmith.io/pomerium/pomerium-enterprise/pomerium-enterprise debug-$VERSION debug-$minor ${latest:+debug}
          $ENTERPRISE_NONROOT docker.io/pomerium/pomerium nonroot-$VERSION nonroot-$minor ${latest:+nonroot}
          $ENTERPRISE_NONROOT docker.cloudsmith.io/pomerium/pomerium-enterprise/pomerium-enterprise nonroot-$VERSION nonroot-$minor ${latest:+nonroot}
          $ENTERPRISE_DEBUG_NONROOT docker.io/pomerium/pomerium debug-nonroot-$VERSION debug-nonroot-$minor ${latest:+debug-nonroot}
          $ENTERPRISE_DEBUG_NONROOT docker.cloudsmith.io/pomerium/pomerium-enterprise/pomerium-enterprise debug-nonroot-$VERSION debug-nonroot-$minor ${latest:+debug-nonroot}
          $ENTERPRISE_INGRESS_CONTROLLER docker.io/pomerium/ingress-controller $VERSION $minor ${latest:+latest}
          $ENTERPRISE_INGRESS_CONTROLLER docker.cloudsmith.io/pomerium/pomerium-enterprise/ingress-controller-enterprise $VERSION $minor ${latest:+latest}
          $INGRESS_CONTROLLER docker.cloudsmith.io/pomerium/ingress-controller/ingress-controller $VERSION $minor ${latest:+latest}
          $CONSOLE gcr.io/pomerium-public/enterprise/pomerium-console $VERSION ${latest:+latest}
          $CONSOLE docker.cloudsmith.io/pomerium/enterprise/pomerium-console $VERSION
          $CLOUDRUN gcr.io/pomerium-io/pomerium $VERSION-cloudrun $minor-cloudrun ${latest:+latest-cloudrun}
          EOF
          while read -r source destination; do
            ./scripts/release copy "$VERSION" "$source" "$destination"
          done < "$RUNNER_TEMP/images"

      - name: Publish releases
        env:
          GH_TOKEN: ${{ steps.ci-token.outputs.token }}
        run: |
          ./scripts/release publish-release pomerium "$VERSION" "$LATEST" "$CORE_STATE"
          ./scripts/release publish-release ingress-controller "$VERSION" "$LATEST" "$INGRESS_CONTROLLER_STATE"
          ./scripts/release publish-release pomerium-console "$VERSION" "$LATEST" "$CONSOLE_STATE"

      - name: Download packages
        env:
          GH_TOKEN: ${{ steps.ci-token.outputs.token }}
        working-directory: ${{ runner.temp }}
        run: |
          v=${VERSION#v}
          gh release download "$VERSION" --repo pomerium/pomerium --pattern "pomerium-$v-1.*.rpm" --pattern "pomerium_$v-1_*.deb"
          gh release download "$VERSION" --repo pomerium/pomerium-console --pattern "pomerium-console-$v-1.*.rpm" --pattern "pomerium-console_$v-1_*.deb"

      - name: Push Cloudsmith packages
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        working-directory: ${{ runner.temp }}
        run: |
          cloudsmith() { docker run --rm -e CLOUDSMITH_API_KEY -v "$PWD:/packages:ro" -w /packages cloudsmith/cloudsmith-cli:1.28.0@sha256:cff4dafad42a4aeb97c018998e5de630b825d07e69381ed43a0db0dd87b5cb90 "$@"; }
          v=${VERSION#v}
          cloudsmith push rpm pomerium/pomerium/el/any-version "pomerium-$v-1.x86_64.rpm" --republish
          cloudsmith push rpm pomerium/pomerium/el/any-version "pomerium-$v-1.aarch64.rpm" --republish
          cloudsmith push deb pomerium/pomerium/any-distro/any-version "pomerium_$v-1_amd64.deb" --republish
          cloudsmith push deb pomerium/pomerium/any-distro/any-version "pomerium_$v-1_arm64.deb" --republish
          cloudsmith push rpm pomerium/enterprise/el/any-version "pomerium-console-$v-1.x86_64.rpm" --republish
          cloudsmith push deb pomerium/enterprise/any-distro/any-version "pomerium-console_$v-1_amd64.deb" --republish

      - name: Create submodule tags
        env:
          GH_TOKEN: ${{ steps.ci-token.outputs.token }}
        run: |
          ./scripts/release create-ref pomerium "refs/tags/pkg/grpc/config/$VERSION" "$GITHUB_SHA"
          ./scripts/release create-ref pomerium "refs/tags/pkg/grpc/databroker/$VERSION" "$GITHUB_SHA"

      - name: Create envoy-custom and enterprise-extensions branches
        if: endsWith(inputs.version, '.0')
        env:
          GH_TOKEN: ${{ steps.ci-token.outputs.token }}
          EXTENSION: ${{ needs.enterprise.outputs.extension }}
        run: |
          branch=pomerium-${VERSION#v}
          branch=${branch//./-}
          envoy=$(awk '$1 == "github.com/pomerium/envoy-custom" { print $2 }' go.mod)
          if [[ $envoy =~ [-.][0-9]{14}-([0-9a-f]{12})$ ]]; then
            envoy=${BASH_REMATCH[1]}
          fi
          envoy=$(gh api "repos/pomerium/envoy-custom/commits/$envoy" --jq .sha)
          ./scripts/release create-branch envoy-custom "$branch" "$envoy"
          ./scripts/release create-branch enterprise-extensions "$branch" "$EXTENSION"

      - name: Update Homebrew tap
        if: env.LATEST == 'true'
        env:
          GH_TOKEN: ${{ steps.ci-token.outputs.token }}
        run: gh api repos/pomerium/homebrew-tap/dispatches -f event_type=pomerium-release -f "client_payload[version]=${VERSION#v}"

      - name: Verify
        env:
          GH_TOKEN: ${{ steps.ci-token.outputs.token }}
        run: |
          while read -r source destination; do
            digest=$(./scripts/release digest "$destination")
            echo "$destination $digest"
            test "$digest" = "${source#*@}"
          done < "$RUNNER_TEMP/images"
          if [ "$LATEST" = true ]; then
            test "$(gh api repos/pomerium/pomerium/releases/latest --jq .tag_name)" = "$VERSION"
          fi
