name: Release
permissions:
  contents: read

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Perform a dry-run (snapshot build, no publishing)"
        required: true
        default: true
        type: boolean

jobs:
  goreleaser:
    permissions:
      contents: write
      issues: read
      pull-requests: read
    runs-on: ubuntu-22.04
    env:
      DOCKER_CLI_EXPERIMENTAL: "enabled"
    outputs:
      tag: ${{ steps.tagName.outputs.tag }}
      version: ${{ steps.tagName.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Unshallow
        run: git fetch --prune --unshallow

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .tool-versions
          package-manager-cache: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: .tool-versions
          cache: false

      - name: Set up Docker
        run: docker run --rm --privileged multiarch/qemu-user-static:7.2.0-1@sha256:fe60359c92e86a43cc87b3d906006245f77bfc0565676b80004cc666e4feb9f0 --reset -p yes

      - name: gcloud authenticate
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ secrets.GCP_PRODUCTION_PROJECT_ID }}
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: gcloud sdk
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db

      - name: Gcloud login
        run: gcloud auth configure-docker gcr.io,us-central1-docker.pkg.dev

      - name: Get GoReleaser version
        id: goreleaser-version
        run: echo "version=v$(grep '^goreleaser ' .tool-versions | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de
        with:
          version: ${{ steps.goreleaser-version.outputs.version }}
          args: >-
            release
            ${{ inputs.dry_run && '--snapshot' || '' }}
            --clean
            --config .github/goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get tag name
        if: ${{ !inputs.dry_run }}
        id: tagName
        run: |
          TAG=$(git describe --tags --exact-match --match 'v[0-9]*')
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Install Cloudsmith CLI
        if: github.event_name == 'release' && !github.event.release.prerelease
        run: |
          pip3 install cloudsmith-cli

      - name: Publish to Cloudsmith
        if: github.event_name == 'release' && !github.event.release.prerelease
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          VERSION: ${{ steps.tagName.outputs.version }}
        working-directory: dist/
        run: |
          RPMS="pomerium-${VERSION}-1.x86_64.rpm pomerium-${VERSION}-1.aarch64.rpm"
          for pkg in $(echo $RPMS); do
            cloudsmith push rpm pomerium/pomerium/el/any-version $pkg
          done

          DEBS="pomerium_${VERSION}-1_amd64.deb pomerium_${VERSION}-1_arm64.deb"
          for pkg in $(echo $DEBS); do
            cloudsmith push deb pomerium/pomerium/any-distro/any-version $pkg
          done

      - name: Find latest tag
        if: github.event_name == 'release' && !github.event.release.prerelease
        id: latestTag
        run: |
          tags=$(git ls-remote --tags --refs origin)
          echo "tag=$(grep -oE 'refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' <<<"$tags" | cut -d/ -f3 | sort --version-sort | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Publish latest tag
        if: github.event_name == 'release' && steps.latestTag.outputs.tag == steps.tagName.outputs.tag
        run: |
          docker manifest create -a us-central1-docker.pkg.dev/pomerium-public-prd/pomerium/pomerium:latest us-central1-docker.pkg.dev/pomerium-public-prd/pomerium/pomerium:amd64-${{ steps.tagName.outputs.tag }} us-central1-docker.pkg.dev/pomerium-public-prd/pomerium/pomerium:arm64v8-${{ steps.tagName.outputs.tag }}
          docker manifest push us-central1-docker.pkg.dev/pomerium-public-prd/pomerium/pomerium:latest

          docker tag gcr.io/pomerium-io/pomerium:${{ steps.tagName.outputs.tag }}-cloudrun gcr.io/pomerium-io/pomerium:latest-cloudrun
          docker push gcr.io/pomerium-io/pomerium:latest-cloudrun

          docker manifest create -a us-central1-docker.pkg.dev/pomerium-public-prd/pomerium/pomerium:nonroot us-central1-docker.pkg.dev/pomerium-public-prd/pomerium/pomerium:nonroot-amd64-${{ steps.tagName.outputs.tag }} us-central1-docker.pkg.dev/pomerium-public-prd/pomerium/pomerium:nonroot-arm64v8-${{ steps.tagName.outputs.tag }}
          docker manifest push us-central1-docker.pkg.dev/pomerium-public-prd/pomerium/pomerium:nonroot

          docker manifest create -a us-central1-docker.pkg.dev/pomerium-public-prd/pomerium/pomerium:debug us-central1-docker.pkg.dev/pomerium-public-prd/pomerium/pomerium:debug-amd64-${{ steps.tagName.outputs.tag }} us-central1-docker.pkg.dev/pomerium-public-prd/pomerium/pomerium:debug-arm64v8-${{ steps.tagName.outputs.tag }}
          docker manifest push us-central1-docker.pkg.dev/pomerium-public-prd/pomerium/pomerium:debug

          docker manifest create -a us-central1-docker.pkg.dev/pomerium-public-prd/pomerium/pomerium:debug-nonroot us-central1-docker.pkg.dev/pomerium-public-prd/pomerium/pomerium:debug-nonroot-amd64-${{ steps.tagName.outputs.tag }} us-central1-docker.pkg.dev/pomerium-public-prd/pomerium/pomerium:debug-nonroot-arm64v8-${{ steps.tagName.outputs.tag }}
          docker manifest push us-central1-docker.pkg.dev/pomerium-public-prd/pomerium/pomerium:debug-nonroot

  darwin:
    if: ${{ !cancelled() && needs.goreleaser.outputs.tag != '' }}
    needs: goreleaser
    runs-on: ubuntu-22.04
    environment: apple-signing
    permissions:
      contents: write
    steps:
      - name: Check signing secrets
        env:
          SECRETS_SET: ${{ secrets.MACOS_SIGN_P12 && secrets.MACOS_SIGN_PASSWORD && secrets.APPLE_ID_KEY && secrets.APPLE_ID && secrets.APPLE_ID_KEY_ISSUER && 'true' }}
        run: test "$SECRETS_SET" = true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .tool-versions
          package-manager-cache: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: .tool-versions
          cache: false

      - name: Build dependencies without signing secrets
        run: make deps-build build-ui

      - name: Get GoReleaser version
        id: goreleaser-version
        run: echo "version=v$(grep '^goreleaser ' .tool-versions | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Prepare notarization key
        env:
          APPLE_ID_KEY: ${{ secrets.APPLE_ID_KEY }}
        run: |
          umask 077
          printf '%s' "$APPLE_ID_KEY" > "$RUNNER_TEMP/apple-notary.p8"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de
        with:
          version: ${{ steps.goreleaser-version.outputs.version }}
          args: release --clean --skip=before --config .github/goreleaser-mac.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ runner.temp }}/apple-notary.p8
          MACOS_NOTARY_KEY_ID: ${{ secrets.APPLE_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.APPLE_ID_KEY_ISSUER }}

      - name: Remove notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/apple-notary.p8"

      - name: Find highest vX.Y.Z tag
        id: highestTag
        if: github.event_name == 'release' && !github.event.release.prerelease
        run: |
          tags=$(git ls-remote --tags --refs origin)
          echo "tag=$(grep -oE 'refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' <<<"$tags" | cut -d/ -f3 | sort --version-sort | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Create CI token
        id: ci-token
        if: steps.highestTag.outputs.tag == needs.goreleaser.outputs.tag
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ secrets.POMERIUM_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.POMERIUM_CI_APP_PRIVATE_KEY }}
          owner: pomerium
          repositories: homebrew-tap
          permission-contents: write

      - name: Update Homebrew tap
        if: steps.highestTag.outputs.tag == needs.goreleaser.outputs.tag
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697
        with:
          repository: pomerium/homebrew-tap
          token: ${{ steps.ci-token.outputs.token }}
          event-type: pomerium-release
          client-payload: '{ "version": "${{ needs.goreleaser.outputs.version }}" }'

  tag-sub-packages:
    runs-on: ubuntu-22.04
    needs: goreleaser
    if: github.event_name == 'release'
    steps:
      - name: Create CI token
        id: ci-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ secrets.POMERIUM_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.POMERIUM_CI_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pomerium/pomerium
          token: ${{ steps.ci-token.outputs.token }}

      - name: Tag
        run: |
          git tag pkg/grpc/config/${{ needs.goreleaser.outputs.tag }} ${{ needs.goreleaser.outputs.tag }}
          git push origin tag pkg/grpc/config/${{ needs.goreleaser.outputs.tag }}
          git tag pkg/grpc/databroker/${{ needs.goreleaser.outputs.tag }} ${{ needs.goreleaser.outputs.tag }}
          git push origin tag pkg/grpc/databroker/${{ needs.goreleaser.outputs.tag }}
