name: Acceptance Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a branch cancels an in-flight acceptance run for that branch.
concurrency:
  group: acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Each e2e harness runs as an INDEPENDENT job (own runner, own stack, own
# timeout) so they run in parallel and can't break each other. Every harness
# uploads an `e2e-results-<name>` artifact containing its Playwright
# results.json. The `summary` job fans in: it downloads every results artifact,
# merges each harness's committed feature-map.json fragment, and renders ONE
# Feature Coverage table (Authentication / Authorization / Headers / MCP / ...)
# written to the workflow run summary.
#
# To add a harness: add a job below that uploads an `e2e-results-<name>`
# artifact, drop a feature-map.json fragment in its directory, and add the new
# job to the `summary` job's `needs:` list. That `needs:` entry is the ONLY
# required edit — the aggregator auto-discovers the new results + fragment, and
# the failure check reads `needs.*.result` generically, so neither needs
# touching.
#
# The mcp and downstream-mtls harnesses live under internal/acceptance/suites/
# as an npm workspace, so both install from the single suites/package-lock.json
# (npm ci at the workspace root) and run their own suite Makefile.
# ---------------------------------------------------------------------------

jobs:
  browser:
    name: E2E — browser
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .tool-versions
          cache: 'npm'
          cache-dependency-path: internal/acceptance/browser/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: .tool-versions

      - name: Install Playwright dependencies
        working-directory: internal/acceptance/browser
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run acceptance tests
        working-directory: internal/acceptance
        run: make test
        env:
          CI: true
          # Accept self-signed certificates in test environment
          NODE_TLS_REJECT_UNAUTHORIZED: "0"

      - name: Collect artifacts
        if: always()
        working-directory: internal/acceptance
        run: ./scripts/collect-artifacts.sh

      - name: Upload results (for summary)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: e2e-results-browser
          path: internal/acceptance/artifacts/playwright/results.json
          if-no-files-found: error

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report-browser
          path: internal/acceptance/artifacts/playwright/
          retention-days: 30

      - name: Upload Docker logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: docker-logs
          path: internal/acceptance/artifacts/docker-logs/
          retention-days: 7

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diagnostics
          path: internal/acceptance/artifacts/diagnostics/
          retention-days: 7

      - name: Stop test stack
        if: always()
        working-directory: internal/acceptance
        run: docker compose down -v

  mcp:
    name: E2E — mcp
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .tool-versions
          cache: 'npm'
          cache-dependency-path: internal/acceptance/suites/package-lock.json

      - name: Install mkcert
        # Pinned + checksum-verified (upstream is frozen at v1.4.4, 2022). We do
        # NOT run `mkcert -install`: generating the leaf auto-creates the local
        # CA + rootCA.pem, which is all the MCP client needs via
        # NODE_EXTRA_CA_CERTS (see internal/acceptance/suites/mcp/setup/certs.ts).
        run: |
          MKCERT_VERSION=v1.4.4
          MKCERT_SHA256=6d31c65b03972c6dc4a14ab429f2928300518b26503f58723e532d1b0a3bbb52
          curl -fsSL -o mkcert \
            "https://github.com/FiloSottile/mkcert/releases/download/${MKCERT_VERSION}/mkcert-${MKCERT_VERSION}-linux-amd64"
          echo "${MKCERT_SHA256}  mkcert" | sha256sum -c -
          chmod +x mkcert
          sudo mv mkcert /usr/local/bin/mkcert

      - name: Install Playwright dependencies
        working-directory: internal/acceptance/suites
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run MCP e2e suite
        working-directory: internal/acceptance/suites/mcp
        run: make test
        env:
          CI: true

      - name: Upload results (for summary)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: e2e-results-mcp
          path: internal/acceptance/suites/mcp/results.json
          if-no-files-found: error

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report-mcp
          path: internal/acceptance/suites/mcp/playwright-report/
          retention-days: 30

  downstream-mtls:
    name: E2E — downstream-mtls
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Non-blocking while a CI flake is stabilized: the suite restarts the
    # Pomerium container per spec group, which churns the runner's Docker network
    # and aborts browser navigations with ERR_NETWORK_CHANGED. helpers/nav.ts
    # (gotoStable) retries the navigation itself; continue-on-error keeps a
    # residual flake from red-walling the PR. The job still runs and reports into
    # the coverage summary. Remove once it's proven stable over several runs.
    continue-on-error: false

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .tool-versions
          cache: 'npm'
          cache-dependency-path: internal/acceptance/suites/package-lock.json

      # No mkcert step: this suite builds its full client-certificate PKI with
      # OpenSSL inside an alpine container (see suites/downstream-mtls/setup/certs.ts).

      - name: Install Playwright dependencies
        working-directory: internal/acceptance/suites
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run downstream mTLS e2e suite
        working-directory: internal/acceptance/suites/downstream-mtls
        run: make test
        env:
          CI: true

      - name: Upload results (for summary)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: e2e-results-downstream-mtls
          path: internal/acceptance/suites/downstream-mtls/results.json
          if-no-files-found: error

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report-downstream-mtls
          path: internal/acceptance/suites/downstream-mtls/playwright-report/
          retention-days: 30

  upstream-tls:
    name: E2E — upstream-tls
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .tool-versions
          cache: 'npm'
          cache-dependency-path: internal/acceptance/suites/package-lock.json

      # No mkcert step: this suite builds its upstream TLS/mTLS PKI with OpenSSL
      # inside an alpine container (see suites/upstream-tls/setup/certs.ts).

      - name: Install Playwright dependencies
        working-directory: internal/acceptance/suites
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run upstream TLS e2e suite
        working-directory: internal/acceptance/suites/upstream-tls
        run: make test
        env:
          CI: true

      - name: Upload results (for summary)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: e2e-results-upstream-tls
          path: internal/acceptance/suites/upstream-tls/results.json
          if-no-files-found: error

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report-upstream-tls
          path: internal/acceptance/suites/upstream-tls/playwright-report/
          retention-days: 30

  summary:
    name: E2E — summary
    needs: [browser, mcp, downstream-mtls, upstream-tls]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .tool-versions

      - name: Test summary generator
        run: node --test internal/acceptance/scripts/generate-summary.test.mjs

      - name: Download harness results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: e2e-results-*
          path: e2e-results

      - name: Generate combined summary
        if: always()
        id: summary
        env:
          HARNESS_RESULTS: ${{ toJSON(needs) }}
        run: |
          expected_results=$(node -e 'console.log(Object.keys(JSON.parse(process.env.HARNESS_RESULTS)).length)')
          node internal/acceptance/scripts/generate-summary.mjs \
            --results-dir e2e-results \
            --feature-maps-dir internal/acceptance \
            --expected-results "$expected_results" \
            --output summary.md

      - name: Show combined summary
        if: always()
        run: cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any harness did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more e2e harnesses did not succeed:"
          echo '${{ toJSON(needs) }}'
          exit 1
