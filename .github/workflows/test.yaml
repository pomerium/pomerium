name: Test
permissions:
  contents: read
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04]
        deployment: [multi, single]
        authenticate-flow: [stateful, stateless]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: .tool-versions
          cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .tool-versions

      - name: set env vars
        run: echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: build dev docker image
        run: |
          ./scripts/build-dev-docker.bash

      - name: start cluster
        run: |
          export POMERIUM_TAG=dev
          cd ./integration/clusters/${{matrix.deployment}}-${{matrix.authenticate-flow}}
          docker compose up -d

      - name: integration tests
        env:
          GOTESTSUM_FORMAT: github-actions
        run: |
          (cd ./integration/clusters/${{matrix.deployment}}-${{matrix.authenticate-flow}} && docker compose logs -f &)
          go tool gotestsum --packages="./integration/..." -- -tags integration -v

  e2e:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: .tool-versions
          cache: false

      - name: set env vars
        run: echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      # Heavyweight e2e tests (Docker via testcontainers), each isolated in its
      # own process by make test-e2e. Non-blocking for now: not added to
      # branch-protection required checks until proven stable on main.
      - name: e2e tests
        env:
          GOTESTSUM_FORMAT: github-actions
        run: make test-e2e

  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: .tool-versions

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .tool-versions

      - name: build
        run: make build

      - name: save binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: bin/pomerium*
          name: pomerium ${{ github.run_id }} ${{ matrix.platform }}
          retention-days: 1

      # Linux tests (and coverage) run with Dagger in the test job.
      - name: test
        if: matrix.platform != 'ubuntu-latest'
        timeout-minutes: 30
        env:
          GOTESTSUM_FORMAT: github-actions
        run: make test

  test:
    runs-on: ubuntu-latest
    # A rejected client certificate makes dagger retry instead of failing.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Runs the tests on the shared Dagger engine (or a local one without credentials, e.g. for
      # forks) and exports the coverage profile.
      - uses: calebdoxsey/pomerium-dagger-poc/actions/run@main
        with:
          verb: api
          args: call pomerium cover export --path coverage.txt
          engine-ca-cert: ${{ secrets.DAGGER_CA_CERT }}
          engine-client-cert: ${{ secrets.DAGGER_CLIENT_CERT }}
          engine-client-key: ${{ secrets.DAGGER_CLIENT_KEY }}

      - uses: jandelgado/gcov2lcov-action@e4612787670fc5b5f49026b8c29c5569921de1db
        name: convert coverage to lcov
        with:
          infile: coverage.txt
          outfile: coverage.lcov

      - name: upload to coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: coverage.lcov
          fail-on-error: false

  build-windows:
    # pomerium/cli ships Windows binaries built from these packages, so
    # everything except the unix-only server packages must cross-compile.
    runs-on: ubuntu-latest
    # A rejected client certificate makes dagger retry instead of failing.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Builds windows/amd64 and windows/arm64 on the shared Dagger engine (or a local one without
      # credentials, e.g. for forks).
      - uses: calebdoxsey/pomerium-dagger-poc/actions/run@main
        with:
          args: --check build-windows
          engine-ca-cert: ${{ secrets.DAGGER_CA_CERT }}
          engine-client-cert: ${{ secrets.DAGGER_CLIENT_CERT }}
          engine-client-key: ${{ secrets.DAGGER_CLIENT_KEY }}

  build-docker:
    runs-on: ubuntu-latest
    # A rejected client certificate makes dagger retry instead of failing.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Builds the Dockerfile (without pushing) on the shared Dagger engine, which keeps its layers
      # cached (or a local one without credentials, e.g. for forks).
      - uses: calebdoxsey/pomerium-dagger-poc/actions/run@main
        with:
          args: --check build-docker
          engine-ca-cert: ${{ secrets.DAGGER_CA_CERT }}
          engine-client-cert: ${{ secrets.DAGGER_CLIENT_CERT }}
          engine-client-key: ${{ secrets.DAGGER_CLIENT_KEY }}

  precommit:
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: .tool-versions
          cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .tool-versions

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.x"

      - run: cd ui && npm ci

      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd
        with:
          extra_args: --show-diff-on-failure --from-ref ${{
            github.event.pull_request.base.sha }} --to-ref ${{
            github.event.pull_request.head.sha }}
        env:
          SKIP: lint

  check-docker-images:
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: ./scripts/check-docker-images
