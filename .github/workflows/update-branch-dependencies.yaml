name: Update Branch Dependencies
run-name: Update ${{ inputs.branch }} Dependencies

on:
  workflow_dispatch:
    inputs:
      branch:
        description: The branch to run the script on
        default: main
        required: false
        type: string

jobs:
  update-branch-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch }}

      - name: Setup ASDF
        uses: asdf-vm/actions/install@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1

      - name: Update Tools
        run: ./scripts/update-dependencies tools

      - name: Update Docker Dependencies
        run: ./scripts/update-dependencies docker

      - name: Update Pomerium Dependencies
        if: ${{ inputs.branch == 'main' }}
        run: ./scripts/update-dependencies pomerium

      - name: Proto
        run: make proto

      - name: Create CI token
        id: ci-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.POMERIUM_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.POMERIUM_CI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          author: pomerium-ci-bot[bot] <346165314+pomerium-ci-bot[bot]@users.noreply.github.com>
          base: ${{ inputs.branch }}
          body: "This PR updates dependencies not managed by dependabot."
          branch: ci/update-${{ inputs.branch }}
          commit-message: "ci: update dependencies"
          delete-branch: true
          labels: ci
          title: "ci: update ${{ inputs.branch }} dependencies"
          token: ${{ steps.ci-token.outputs.token }}
