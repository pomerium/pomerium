name: Notify Dependencies

permissions: {}

on:
  push:
    branches:
      - main
      - 0-[0-9]+-*

jobs:
  notify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo:
          - cli
          - hosted-authenticate
          - ingress-controller
          - pomerium-console
          - pomerium-zero
          - terraform-provider-pomerium
          - ui
    steps:
      - name: Create CI token
        id: ci-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ secrets.POMERIUM_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.POMERIUM_CI_APP_PRIVATE_KEY }}
          owner: pomerium
          repositories: ${{ matrix.repo }}
          permission-actions: write

      - name: Notify
        uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855
        with:
          ref: main
          repo: pomerium/${{ matrix.repo }}
          sync-status: true
          token: ${{ steps.ci-token.outputs.token }}
          wait-for-completion: true
          workflow: update-dependencies.yaml
