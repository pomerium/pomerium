version: 2

project_name: pomerium

release:
  prerelease: auto
  replace_existing_artifacts: true

env:
  - CGO_ENABLED=0

builds:
  - main: cmd/pomerium/main.go
    goarch:
      - arm64
    goos:
      - darwin

    ldflags:
      - -s -w
      - -X github.com/pomerium/pomerium/internal/version.officialBuild=1
      - -X github.com/pomerium/pomerium/internal/version.Version={{.Version}}
      - -X github.com/pomerium/pomerium/internal/version.GitCommit={{.ShortCommit}}
      - -X github.com/pomerium/pomerium/internal/version.Timestamp={{.Timestamp}}
      - -X github.com/pomerium/pomerium/internal/version.ProjectName=pomerium
      - -X github.com/pomerium/pomerium/internal/version.ProjectURL=https://www.pomerium.com

notarize:
  macos:
    - enabled: true
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 15m

archives:
  - name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    files:
      - src: licenses/POMERIUM-COMMUNITY-LICENSE-1.0.txt
        dst: LICENSE

checksum:
  name_template: "{{ .ProjectName }}_darwin_checksums.txt"
